services:
  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    # .env is optional (skeleton runs key-less); required:false keeps
    # `docker compose up` working before `cp .env.example .env` is done.
    # SECURITY: before exposing this service beyond localhost, set
    # BASIC_AUTH_USERNAME / BASIC_AUTH_PASSWORD in .env (see docs/security.md);
    # REQUIRE_AUTH=true additionally makes the API refuse to start without them.
    env_file:
      - path: .env
        required: false
    # Durable storage on the compose Postgres below (credentials match
    # the postgres service definition). Remove this to run the API on
    # the in-memory store instead.
    environment:
      DATABASE_URL: postgresql://meeting:meeting@postgres:5432/meeting_agent
    depends_on:
      - postgres
      - redis
    # NOTE: skeleton runs fine WITHOUT these services (in-memory DB + mock).
    # They are here for Phase 1+ (Postgres persistence / Redis queue).

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: meeting_agent
      POSTGRES_USER: meeting
      POSTGRES_PASSWORD: meeting
    # Intentionally NOT published to the host: default-credential service,
    # reachable only inside the compose network. For local debugging bind
    # to loopback explicitly instead, e.g. ports: ["127.0.0.1:5432:5432"].
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    # Same as postgres: no host publication (debug bind: 127.0.0.1:6379:6379).

volumes:
  pgdata:
